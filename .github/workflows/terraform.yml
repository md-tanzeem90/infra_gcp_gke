name: Terraform CI/CD 

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (dev/prod)
        required: true
        default: dev

      action:
        description: plan/apply/destroy
        required: true
        default: plan

      deploy_scope:
        description: infra / helm / all
        required: true
        default: all

      helm_target:
        description: Optional helm release (e.g. prometheus)
        required: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

########################################
# PLAN
########################################
jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    outputs:
      env: ${{ steps.setenv.outputs.env }}
      project_id: ${{ steps.setenv.outputs.project_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set ENV
        id: setenv
        run: |
          ENV=${{ github.event.inputs.environment }}
          [[ "$ENV" == "prod" ]] && PROJECT_ID=proj-ecom-prod || PROJECT_ID=proj-ecom-$ENV

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Cache Terraform
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            terraform/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/${{ steps.setenv.outputs.env }}"

      # ✅ Added basic validation
      - name: Terraform Format & Validate
        run: |
          terraform fmt -check
          terraform validate

      - name: Terraform Plan
        run: |
          TARGET=""

          if [[ "${{ github.event.inputs.deploy_scope }}" == "infra" ]]; then
            TARGET="-target=module.network -target=module.gke"
          elif [[ "${{ github.event.inputs.deploy_scope }}" == "helm" ]]; then
            if [[ -n "${{ github.event.inputs.helm_target }}" ]]; then
              TARGET="-target=helm_release.${{ github.event.inputs.helm_target }}"
            else
              TARGET="-target=helm_release"
            fi
          fi

          terraform plan $TARGET \
            -out=tfplan \
            -var="environment=${{ steps.setenv.outputs.env }}" \
            -var="project_id=${{ steps.setenv.outputs.project_id }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.setenv.outputs.env }}
          path: terraform/tfplan

########################################
# APPLY INFRA
########################################
  apply-infra:
    runs-on: ubuntu-latest
    needs: plan

    if: github.event.inputs.action == 'apply' && 
        (github.event.inputs.deploy_scope == 'infra' || github.event.inputs.deploy_scope == 'all')

    environment:
      name: ${{ github.event.inputs.environment == 'prod' && 'prod-approval' || 'dev-auto' }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.plan.outputs.env }}
          path: terraform

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/${{ needs.plan.outputs.env }}"

      - name: Apply Infra
        run: |
          terraform apply -auto-approve -parallelism=20 \
            -target=module.network \
            -target=module.gke \
            -var="environment=${{ needs.plan.outputs.env }}" \
            -var="project_id=${{ needs.plan.outputs.project_id }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

########################################
# APPLY HELM
########################################
  apply-helm:
    runs-on: ubuntu-latest
    needs: apply-infra

    if: github.event.inputs.action == 'apply' && 
        (github.event.inputs.deploy_scope == 'helm' || github.event.inputs.deploy_scope == 'all')

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/${{ needs.plan.outputs.env }}"

      - name: Apply Helm
        run: |
          if [[ -n "${{ github.event.inputs.helm_target }}" ]]; then
            terraform apply -auto-approve -parallelism=20 \
              -target=helm_release.${{ github.event.inputs.helm_target }} \
              -var="environment=${{ needs.plan.outputs.env }}" \
              -var="project_id=${{ needs.plan.outputs.project_id }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}"
          else
            terraform apply -auto-approve -parallelism=20 \
              -target=helm_release \
              -var="environment=${{ needs.plan.outputs.env }}" \
              -var="project_id=${{ needs.plan.outputs.project_id }}" \
              -var="db_password=${{ secrets.DB_PASSWORD }}"
          fi

########################################
# DESTROY
########################################
  destroy:
    runs-on: ubuntu-latest
    needs: plan

    if: github.event.inputs.action == 'destroy'

    environment:
      name: destroy-approval

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/${{ needs.plan.outputs.env }}"

      - name: Destroy
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ needs.plan.outputs.env }}" \
            -var="project_id=${{ needs.plan.outputs.project_id }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"
