name: Terraform Infrastructure CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev or prod)"
        required: true
        default: "dev"
      action:
        description: "Action (plan/apply/destroy)"
        required: true
        default: "plan"

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    outputs:
      env: ${{ steps.setenv.outputs.env }}
      project_id: ${{ steps.setenv.outputs.project_id }}

    steps:

    - name: Checkout Repo
      uses: actions/checkout@v4

    # ✅ Set ENV + PROJECT_ID (export as outputs)
    - name: Set environment variables
      id: setenv
      run: |
        ENV=${{ github.event.inputs.environment }}

        if [[ "$ENV" == "prod" ]]; then
          PROJECT_ID=proj-ecom-prod
        else
          PROJECT_ID=proj-ecom-$ENV
        fi

        echo "env=$ENV" >> $GITHUB_OUTPUT
        echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="prefix=terraform/${{ steps.setenv.outputs.env }}"

    # ✅ Generate plan file
    - name: Terraform Plan (Save)
      run: |
        terraform plan \
          -out=tfplan \
          -var="environment=${{ steps.setenv.outputs.env }}" \
          -var="project_id=${{ steps.setenv.outputs.project_id }}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}"

    # ✅ Upload plan artifact
    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan-${{ steps.setenv.outputs.env }}
        path: terraform/tfplan



  terraform-apply:
    name: Terraform Apply (Approved)
    runs-on: ubuntu-latest
    needs: terraform-plan

    if: github.event.inputs.action == 'apply'

    environment:
      name: ${{ github.event.inputs.environment == 'prod' && 'prod-approval' || 'dev-auto' }}

    defaults:
      run:
        working-directory: terraform

    steps:

    - name: Checkout Repo
      uses: actions/checkout@v4

    # ✅ Download saved plan
    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan-${{ needs.terraform-plan.outputs.env }}
        path: terraform

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="prefix=terraform/${{ needs.terraform-plan.outputs.env }}"

    # ✅ Apply EXACT approved plan
    - name: Terraform Apply Saved Plan
      run: terraform apply -auto-approve tfplan



  terraform-destroy:
    name: Terraform Destroy (Approved)
    runs-on: ubuntu-latest
    needs: terraform-plan

    if: github.event.inputs.action == 'destroy'

    environment:
      name: destroy-approval

    defaults:
      run:
        working-directory: terraform

    steps:

    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="prefix=terraform/${{ github.event.inputs.environment }}"

    - name: Terraform Destroy
      run: |
        terraform destroy -auto-approve \
          -var="environment=${{ github.event.inputs.environment }}" \
          -var="project_id=proj-ecom-${{ github.event.inputs.environment }}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}"
