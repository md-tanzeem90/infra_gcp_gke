name: Terraform Infrastructure CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:

jobs:

  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

    - name: Checkout Repo
      uses: actions/checkout@v4

    # ✅ Detect branch → environment
    - name: Detect branch and set environment
      run: |
        BRANCH=${GITHUB_REF##*/}

        SAFE_BRANCH=$(echo $BRANCH | sed 's/\//-/g')

        echo "Branch: $BRANCH"
        echo "Safe Branch: $SAFE_BRANCH"

        if [[ "$BRANCH" == "main" ]]; then
          echo "ENV=prod" >> $GITHUB_ENV
          echo "PROJECT_ID=proj-ecom-prod" >> $GITHUB_ENV
        else
          echo "ENV=$SAFE_BRANCH" >> $GITHUB_ENV
          echo "PROJECT_ID=proj-ecom-$SAFE_BRANCH" >> $GITHUB_ENV
        fi

    - name: Debug values
      run: |
        echo "ENV=$ENV"
        echo "PROJECT_ID=$PROJECT_ID"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    # ✅ Dynamic backend per branch
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="prefix=terraform/${ENV}"

    - name: Terraform Format
      run: terraform fmt -recursive

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: terraform validate

    # ✅ Plan with dynamic variables
    - name: Terraform Plan
      run: |
        terraform plan \
          -var="environment=${ENV}" \
          -var="project_id=${PROJECT_ID}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}"

    # ✅ Apply only on push (not PR)
    - name: Terraform Apply
      if: github.event_name == 'push'
      run: |
        terraform apply -auto-approve \
          -var="environment=${ENV}" \
          -var="project_id=${PROJECT_ID}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}"



  terraform-destroy:

    name: Terraform Destroy (Manual Approval)
    runs-on: ubuntu-latest
    needs: terraform

    # ✅ Allow destroy for non-prod only (safe)
    if: github.ref != 'refs/heads/main'

    environment:
      name: destroy-approval

    defaults:
      run:
        working-directory: terraform

    steps:

    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Detect branch and set environment
      run: |
        BRANCH=${GITHUB_REF##*/}

        SAFE_BRANCH=$(echo $BRANCH | sed 's/\//-/g')

        echo "ENV=$SAFE_BRANCH" >> $GITHUB_ENV
        echo "PROJECT_ID=proj-ecom-$SAFE_BRANCH" >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="prefix=terraform/${ENV}"

    - name: Terraform Destroy Plan
      run: |
        terraform plan -destroy \
          -var="environment=${ENV}" \
          -var="project_id=${PROJECT_ID}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}"

    - name: Terraform Destroy
      run: |
        terraform destroy -auto-approve \
          -var="environment=${ENV}" \
          -var="project_id=${PROJECT_ID}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}"
